
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programming contact</title>
    <link rel="stylesheet" href="Css/style.css">
</head>
<body>

    <nav class="important-links" aria-label="Main navigation">
        <h2>Important Links</h2>
        <div class="Links">
            <a href="index.html">index</a>
            <a href="about.html">about</a>
            <a href="contact.html" aria-current="page">contact</a>
        </div>
    </nav>

    <main>
        <h1>Importance Of Programming</h1>
        <p>Contact Us</p>

        <section class="Data" aria-labelledby="data-heading">
            <h2 id="data-heading">Enter Your Data :-</h2>

            <form action="#" method="get">

                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name"
                           required placeholder="Enter Your Name">
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email"
                           required placeholder="Enter Your Email">
                </div>

                <div class="form-group">
                    <label for="age">Age</label>
                    <input type="number" id="age" name="age"
                           min="1" max="120" placeholder="Enter Your age">
                </div>

                <div class="form-group">
                    <label for="birth-date">Birth date</label>
                    <input type="date" id="birth-date" name="birth-date">
                </div>

                <fieldset class="form-group">
                    <legend>Enter Your gender</legend>

                    <div class="choice-row">
                        <label>
                            <input type="radio" id="male" name="gender" value="male">
                            Male
                        </label>

                        <label>
                            <input type="radio" id="female" name="gender" value="female">
                            Female
                        </label>
                    </div>
                </fieldset>

                <div class="form-group">
                    <label for="country">Country</label>
                    <select id="country" name="country">
                        <option value="Libya">Libya</option>
                        <option value="Morocco">Morroco</option>
                        <option value="Algeria">Algeria</option>
                        <option value="Egypt" selected>Egypt</option>
                        <option value="Palestine">Palastine</option>
                        <option value="Syria">seriya</option>
                        <option value="Lebanon">lebanon</option>
                        <option value="Tunisia">Tunisia</option>
                    </select>
                </div>

                <div class="form-group masss">
                    <label for="message">Write Any Comment</label>
                    <textarea id="message" name="message" rows="5"
                              placeholder="Write your comment here"></textarea>
                </div>

                <button type="submit">Send</button>
                <button type="reset" class="secondary-button">Reset</button>

            </form>

            <audio src="talaa-al-badro.mp3" controls preload="none">
                Your browser does not support the audio element.
            </audio>
        </section>

        <section class="component-demo" aria-labelledby="components-heading">
            <h2 id="components-heading">Component examples</h2>

            <div class="alert" role="status">
                <strong>Note:</strong> This is an example notification message.
            </div>

            <p class="modal-actions">
                <a class="button-link" href="#demo-modal">Open sample modal</a>
            </p>
        </section>

        <section id="demo-modal" class="modal"
                 role="dialog" aria-modal="true"
                 aria-labelledby="modal-heading">
            <div class="modal-content">
                <h2 id="modal-heading">Sample modal window</h2>
                <p>This is a CSS-only modal example.</p>
                <a class="button-link" href="#" aria-label="Close modal window">
                    Close
                </a>
            </div>
        </section>
    </main>

</body>
</html>
